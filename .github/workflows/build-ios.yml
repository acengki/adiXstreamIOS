name: Build iOS (tanpa Mac pribadi)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator (cek kompilasi, tanpa signing)
        run: |
          xcodebuild build -project AdiXtreamIOS.xcodeproj -scheme AdiXtreamIOS \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned .app for device
        run: |
          xcodebuild build -project AdiXtreamIOS.xcodeproj -scheme AdiXtreamIOS \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/AdiXtreamIOS.app" Payload/
          zip -r AdiXtreamIOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AdiXtreamIOS-unsigned-ipa
          path: AdiXtreamIOS-unsigned.ipa
